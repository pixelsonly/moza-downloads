name: release-please (reusable)

on:
  workflow_call:
    secrets:
      AUTOMATION_APP_PRIVATE_KEY:
        required: true
    outputs:
      paths_released:
        description: JSON array of package paths that had (draft) releases created
        value: ${{ jobs.release-please.outputs.paths_released }}
      all:
        description: Every release-please output as JSON, e.g. "<path>--tag_name"
        value: ${{ jobs.release-please.outputs.all }}

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      all: ${{ toJSON(steps.release.outputs) }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
