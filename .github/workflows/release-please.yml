name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ !github.event.repository.is_template }}
    uses: ./.github/workflows/reusable-release-please.yml
    secrets: inherit

  # Releases are created as drafts (repo has immutable releases, so assets can't be added
  # after publishing). Drafts fire no release event, so build, attach and publish from here.
  release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ fromJSON(needs.release-please.outputs.all)[format('{0}--tag_name', matrix.path)] }}
