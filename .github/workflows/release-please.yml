name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ !github.event.repository.is_template }}
    uses: pixelsonly/control-plane/.github/workflows/reusable-release-please.yml@main
    secrets: inherit
