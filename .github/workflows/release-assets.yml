name: release-assets

# Builds a dashboard from its release tag, attaches the zip to the draft release, then
# publishes it. Called by release-please for each new release. Run it manually to retry a
# draft whose upload failed; a published release is immutable and can't be rebuilt.
on:
  workflow_call:
    inputs:
      tag:
        description: Draft release tag to build and publish, e.g. ksp01-v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to build and publish, e.g. ksp01-v0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Parse the tag with the default branch's parser, so older tags without it can be rebuilt.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .tools
          sparse-checkout: scripts/release_tag.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve dashboard and version from tag
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! out="$(python3 .tools/scripts/release_tag.py "$TAG" 2>&1)"; then
            echo "::error::$out"
            exit 1
          fi
          echo "$out" >> "$GITHUB_OUTPUT"

      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft --repo "$GITHUB_REPOSITORY")" != true ]; then
            echo "::error::release '$TAG' is published; immutable releases can't take new assets"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: Check the dashboard exists
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          ID: ${{ steps.resolve.outputs.id }}
        run: |
          if [ ! -f "dashboards/$ID/dashboard.json" ]; then
            echo "::error::no dashboard '$ID' for tag '$TAG'"
            exit 1
          fi

      - name: Test this dashboard
        env:
          ID: ${{ steps.resolve.outputs.id }}
        run: scripts/check.sh "$ID"

      - name: Build and package
        id: package
        env:
          ID: ${{ steps.resolve.outputs.id }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          python3 "dashboards/$ID/build.py"
          zip="$(python3 scripts/package.py "$ID" "$VERSION")"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
